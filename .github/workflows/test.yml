name: test

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# A push to master followed by a tag push on the same SHA used to trigger
# two identical workflow runs (one for the branch, one for the tag) and
# therefore two emails. Skip tag pushes; cancel in-progress runs on the
# same ref when a new commit lands.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e "./mcp-server[dev]"
      - name: Test
        run: python -m pytest -q mcp-server/tests
