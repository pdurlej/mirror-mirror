[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mirror-mirror"
version = "0.2.1"
description = "MCP server for mirror-mirror — functional-emotional readout protocol"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
readout-server = "server:main"

[tool.hatch.build.targets.wheel]
include = ["server.py", "usage.py"]

[tool.hatch.build.targets.sdist]
include = [
    "server.py",
    "usage.py",
    "README.md",
    "pyproject.toml",
    "tests/",
]
exclude = [
    "__pycache__",
    ".pytest_cache",
    ".venv",
    "*.jsonl",
    "*.pyc",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
